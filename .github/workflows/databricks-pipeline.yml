name: Complete MLOps Pipeline CI/CD

on:
  push:
    branches:
      - main
      - develop
    # Le pipeline se déclenche si vous modifiez un fichier .py n'importe où
    paths:
      - '**/*.py'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Run full refresh'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-pipeline:
    name: Validate Pipeline Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install pyspark requests
      
      - name: Validate Python syntax
        run: |
          # Cette commande vérifie tous les fichiers python du projet
          python -m py_compile **/*.py

  trigger-pipeline:
    name: Trigger Complete MLOps Pipeline
    runs-on: ubuntu-latest
    needs: validate-pipeline
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Trigger Pipeline Update
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          PIPELINE_ID: ${{ secrets.PIPELINE_ID }}
        run: |
          # On s'assure que le chemin vers trigger_pipeline.py est correct
          python cicd/trigger_pipeline.py --action start-and-wait ${{ github.event.inputs.full_refresh && '--full-refresh' || '' }}
      
      - name: Pipeline Status
        if: always()
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          PIPELINE_ID: ${{ secrets.PIPELINE_ID }}
        run: |
          python cicd/trigger_pipeline.py --action status